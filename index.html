<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRTS 同传">
<title>PRTS // 课堂即时同声传译</title>
<style>
  :root {
    --bg-main: #0c0f12;
    --bg-card: #151a21;
    --border-color: #242c38;
    --accent-blue: #0098dc;
    --accent-glow: rgba(0, 152, 220, 0.25);
    --text-primary: #f0f4f8;
    --text-secondary: #9ba8b8;
    --text-muted: #576575;
    --en-color: #d8e2ed;
    --zh-color: #ffffff;
    --danger: #e05252;
    --warning: #f5a623;
    --success: #3dd68c;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
  }

  /* 顶部导航栏 */
  header {
    height: 50px;
    background: rgba(15, 19, 25, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
    z-index: 10;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-logo {
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent-blue);
    transform: rotate(45deg);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .brand-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-primary);
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .status-dot.recording {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 1.5s infinite;
  }

  .status-dot.paused {
    background: var(--warning);
    box-shadow: 0 0 8px var(--warning);
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.7; }
  }

  /* 核心文本流展示区 */
  #stream-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  .bubble-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeIn 0.25s ease-out forwards;
    transition: border-color 0.3s;
  }

  .bubble-card.live {
    border-color: rgba(0, 152, 220, 0.4);
    box-shadow: 0 2px 12px rgba(0, 152, 220, 0.08);
  }

  .bubble-time {
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .bubble-en {
    font-size: 15px;
    line-height: 1.45;
    color: var(--en-color);
    word-break: break-word;
  }

  .bubble-zh {
    font-size: 16px;
    line-height: 1.5;
    font-weight: 500;
    color: var(--zh-color);
    border-top: 1px dashed rgba(255, 255, 255, 0.08);
    padding-top: 8px;
    word-break: break-word;
  }

  .bubble-zh.translating {
    color: var(--text-secondary);
    font-style: italic;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 底部控制台 */
  footer {
    background: rgba(15, 19, 25, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-color);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    z-index: 10;
  }

  .control-grid {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    flex: 1;
    height: 48px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--accent-blue);
    color: #ffffff;
    box-shadow: 0 2px 10px var(--accent-glow);
  }

  .btn-warning {
    background: #232a35;
    border: 1px solid #3c495c;
    color: var(--warning);
  }

  .btn-danger {
    background: rgba(224, 82, 82, 0.12);
    border: 1px solid rgba(224, 82, 82, 0.4);
    color: var(--danger);
    flex: 0 0 90px;
  }

  .config-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .config-link {
    color: var(--accent-blue);
    text-decoration: underline;
    cursor: pointer;
  }

  /* 配置模态窗 */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }

  .modal-card {
    background: #181e26;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    width: 100%;
    max-width: 360px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .input-field {
    width: 100%;
    height: 40px;
    background: #0d1116;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0 10px;
    color: var(--text-primary);
    font-size: 13px;
  }

  .input-field:focus {
    outline: none;
    border-color: var(--accent-blue);
  }
</style>
</head>
<body>

<audio id="keepAliveAudio" loop playsinline style="display:none;"></audio>

<header>
  <div class="brand-group">
    <div class="brand-logo"></div>
    <div class="brand-title">PRTS // TRANSLATOR</div>
  </div>
  <div class="status-indicator">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">就绪待命</span>
  </div>
</header>

<main id="stream-container">
  <div class="bubble-card" style="border-style: dashed; border-color: rgba(255,255,255,0.1);">
    <div class="bubble-time">SYSTEM STATUS</div>
    <div class="bubble-en">Tap [开始听课] to capture classroom lectures in real-time.</div>
    <div class="bubble-zh">点击下方【开始听课】，手机将自动锁定屏幕常亮并开启实时学术同传。</div>
  </div>
</main>

<footer>
  <div class="control-grid">
    <button class="btn btn-primary" id="btnMainAction">
      <span id="btnMainText">开始听课</span>
    </button>
    <button class="btn btn-warning" id="btnPause" style="display:none;">
      <span>暂停</span>
    </button>
    <button class="btn btn-danger" id="btnStop" style="display:none;">
      <span>结束归档</span>
    </button>
  </div>
  <div class="config-bar">
    <span id="sessionTimer">历时: 00:00:00</span>
    <span class="config-link" id="btnOpenConfig">配置模型 API</span>
  </div>
</footer>

<!-- 配置窗口 -->
<div class="modal-overlay" id="configModal">
  <div class="modal-card">
    <div class="modal-title">同传引擎设置</div>
    <div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">API 格式与通道</div>
      <select id="apiTypeSelect" class="input-field">
        <option value="gemini">Google Gemini 官方通道</option>
        <option value="openai">OpenAI / 中转兼容通道</option>
      </select>
    </div>
    <div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">API Key (密钥)</div>
      <input type="password" id="apiKeyInput" class="input-field" placeholder="粘贴您的 API Key">
    </div>
    <div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">自定义端点 / 代理地址 (可选)</div>
      <input type="text" id="apiEndpointInput" class="input-field" placeholder="例如 https://api.qfgapi.com/v1">
    </div>
    <div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">模型名称 (OpenAI/中转通道生效)</div>
      <input type="text" id="apiModelInput" class="input-field" placeholder="默认 gemini-2.5-flash">
    </div>
    <div style="display:flex; gap:8px; margin-top:6px;">
      <button class="btn btn-primary" id="btnSaveConfig" style="height:38px;">保存</button>
      <button class="btn btn-warning" id="btnCloseConfig" style="height:38px;">取消</button>
    </div>
  </div>
</div>

<script>
// -------------------------------------------------------------
// 1. 系统核心状态管理
// -------------------------------------------------------------
let isRecording = false;
let isPaused = false;
let isRestarting = false;
let recognition = null;
let wakeLock = null;
let timerInterval = null;
let sessionSeconds = 0;
let fullHistory = [];
let currentCardId = null;
let translationTimer = null;
let audioCtx = null;

let API_TYPE = localStorage.getItem('PRTS_TRANS_API_TYPE') || 'gemini';
let API_KEY = localStorage.getItem('PRTS_TRANS_API_KEY') || '';
let API_ENDPOINT = localStorage.getItem('PRTS_TRANS_ENDPOINT') || '';

const streamContainer = document.getElementById('stream-container');
const btnMainAction = document.getElementById('btnMainAction');
const btnMainText = document.getElementById('btnMainText');
const btnPause = document.getElementById('btnPause');
const btnStop = document.getElementById('btnStop');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const sessionTimer = document.getElementById('sessionTimer');
const configModal = document.getElementById('configModal');
const btnOpenConfig = document.getElementById('btnOpenConfig');
const btnCloseConfig = document.getElementById('btnCloseConfig');
const btnSaveConfig = document.getElementById('btnSaveConfig');
const apiTypeSelect = document.getElementById('apiTypeSelect');
const apiKeyInput = document.getElementById('apiKeyInput');
const apiEndpointInput = document.getElementById('apiEndpointInput');
const apiModelInput = document.getElementById('apiModelInput');
const keepAliveAudio = document.getElementById('keepAliveAudio');

// -------------------------------------------------------------
// 2. iOS 深度保活：物理无声循环 + Wake Lock 防熄屏
// -------------------------------------------------------------
function setupSilentAudioLoop() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    source.connect(audioCtx.destination);
    source.start(0);

    // 采用更稳妥的无声 WAV Base64 音频标签双保险
    keepAliveAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
    keepAliveAudio.play().catch(()=>{});
  } catch (e) {
    console.log("Audio loop handled:", e);
  }
}

async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {
      console.warn('Wake Lock error:', err);
    }
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(()=>{});
    wakeLock = null;
  }
}

// -------------------------------------------------------------
// 3. 高健壮性语音识别引擎 (防自动断连看门狗机制)
// -------------------------------------------------------------
function createRecognitionInstance() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("当前环境不支持语音识别，请在 iPhone Safari 中打开使用。");
    return null;
  }

  const sr = new SpeechRecognition();
  sr.continuous = true;
  sr.interimResults = true;
  sr.lang = 'en-US';

  sr.onstart = () => {
    isRestarting = false;
    statusDot.className = 'status-dot recording';
    statusText.innerText = '正在听讲';
  };

  sr.onresult = (event) => {
    if (isPaused) return;

    let interimTranscript = '';
    let finalTranscript = '';

    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript;
      } else {
        interimTranscript += event.results[i][0].transcript;
      }
    }

    handleTranscriptUpdate(finalTranscript, interimTranscript);
  };

  sr.onerror = (event) => {
    console.warn("Speech error notice:", event.error);
    if (event.error === 'not-allowed') {
      alert("请允许 Safari 使用麦克风权限。");
      stopAndExportSession();
    }
  };

  // 关键：iOS Safari 静音 10 秒会自动触发 onend，必须无感知瞬时拉起
  sr.onend = () => {
    if (isRecording && !isPaused && !isRestarting) {
      isRestarting = true;
      setTimeout(() => {
        if (isRecording && !isPaused) {
          try {
            sr.start();
          } catch(e) {
            // 若抛出状态异常，彻底重建实例
            recognition = createRecognitionInstance();
            try { recognition.start(); } catch(err){}
          }
        }
        isRestarting = false;
      }, 300);
    }
  };

  return sr;
}

// -------------------------------------------------------------
// 4. 双语卡片展示与意群断句
// -------------------------------------------------------------
function getCurrentTimeStr() {
  const now = new Date();
  return now.toTimeString().split(' ')[0];
}

function handleTranscriptUpdate(finalText, interimText) {
  const textToShow = (finalText || interimText).trim();
  if (!textToShow) return;

  if (!currentCardId) {
    currentCardId = 'card_' + Date.now();
    const card = document.createElement('div');
    card.className = 'bubble-card live';
    card.id = currentCardId;
    card.innerHTML = `
      <div class="bubble-time">${getCurrentTimeStr()}</div>
      <div class="bubble-en">${escapeHtml(textToShow)}</div>
      <div class="bubble-zh translating">正在即时同传...</div>
    `;
    streamContainer.appendChild(card);
    streamContainer.scrollTop = streamContainer.scrollHeight;
  } else {
    const card = document.getElementById(currentCardId);
    if (card) {
      card.querySelector('.bubble-en').innerText = textToShow;
      streamContainer.scrollTop = streamContainer.scrollHeight;
    }
  }

  if (finalText) {
    triggerTranslation(currentCardId, finalText.trim());
    currentCardId = null;
  } else {
    clearTimeout(translationTimer);
    translationTimer = setTimeout(() => {
      if (currentCardId) {
        const card = document.getElementById(currentCardId);
        if (card) {
          const enText = card.querySelector('.bubble-en').innerText.trim();
          if (enText.length >= 6) {
            triggerTranslation(currentCardId, enText);
            currentCardId = null;
          }
        }
      }
    }, 1300);
  }
}

// -------------------------------------------------------------
// 5. 学术大模型学术同传请求 (支持 Gemini / OpenAI 双路由)
// -------------------------------------------------------------
async function triggerTranslation(cardId, englishText) {
  const card = document.getElementById(cardId);
  if (!card) return;

  const zhElem = card.querySelector('.bubble-zh');

  if (!API_KEY) {
    zhElem.innerText = "【未配置 API Key，请点击下方配置】";
    zhElem.classList.remove('translating');
    saveToHistory(card.querySelector('.bubble-time').innerText, englishText, zhElem.innerText);
    return;
  }

  const promptSystem = "你是一名顶尖的大学全英文课堂学术同传译员。将讲师的英文实时翻译为流畅、简明、贴合大学哲学、商科语境的地道中文。严禁任何说明或多余废话，直接输出中文翻译。";

  try {
    let translated = "";

    if (API_TYPE === 'gemini') {
      const endpoint = API_ENDPOINT.trim() 
        ? `${API_ENDPOINT.replace(/\/$/, '')}/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`
        : `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [
            { role: 'user', parts: [{ text: `${promptSystem}\n\n讲师原句: "${englishText}"` }] }
          ]
        })
      });

      const data = await resp.json();
      if (data.candidates && data.candidates[0].content.parts) {
        translated = data.candidates[0].content.parts[0].text.trim();
      } else {
        translated = "翻译解析异常";
      }
    } else {
      // OpenAI / 第三方中转格式
      const endpoint = API_ENDPOINT.trim()
        ? `${API_ENDPOINT.replace(/\/$/, '')}${API_ENDPOINT.includes('/v1') ? '' : '/v1'}/chat/completions`
        : `https://api.openai.com/v1/chat/completions`;

      const chosenModel = (localStorage.getItem('PRTS_TRANS_MODEL') || 'gemini-2.5-flash').trim();

      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: chosenModel,
          messages: [
            { role: "system", content: promptSystem },
            { role: "user", content: `讲师原句: "${englishText}"` }
          ],
          temperature: 0.3
        })
      });

      const data = await resp.json();
      if (data.choices && data.choices[0].message) {
        translated = data.choices[0].message.content.trim();
      } else {
        translated = "翻译返回异常";
      }
    }

    zhElem.innerText = translated;
    zhElem.classList.remove('translating');
    card.classList.remove('live');
    saveToHistory(card.querySelector('.bubble-time').innerText, englishText, translated);
  } catch (err) {
    console.error("Translation fail:", err);
    zhElem.innerText = "网络抖动，保留英文原文";
    zhElem.classList.remove('translating');
  }
}

function saveToHistory(timeStr, en, zh) {
  fullHistory.push({ time: timeStr, en: en, zh: zh });
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// -------------------------------------------------------------
// 6. 控制台调度与计时
// -------------------------------------------------------------
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!isPaused) {
      sessionSeconds++;
      const h = String(Math.floor(sessionSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((sessionSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(sessionSeconds % 60).padStart(2, '0');
      sessionTimer.innerText = `历时: ${h}:${m}:${s}`;
    }
  }, 1000);
}

btnMainAction.addEventListener('click', () => {
  if (!isRecording) startSession();
});

btnPause.addEventListener('click', () => {
  if (isPaused) resumeSession();
  else pauseSession();
});

btnStop.addEventListener('click', () => {
  if (confirm("是否结束当前课程录制并导出整篇中英文双语档案？")) {
    stopAndExportSession();
  }
});

function startSession() {
  recognition = createRecognitionInstance();
  if (!recognition) return;

  setupSilentAudioLoop();
  requestWakeLock();
  startTimer();

  try { recognition.start(); } catch(e){}

  isRecording = true;
  isPaused = false;

  btnMainAction.style.display = 'none';
  btnPause.style.display = 'flex';
  btnStop.style.display = 'flex';
  btnPause.innerHTML = '<span>暂停</span>';
}

function pauseSession() {
  isPaused = true;
  if (recognition) {
    try { recognition.stop(); } catch(e){}
  }
  statusDot.className = 'status-dot paused';
  statusText.innerText = '已暂停挂起';
  btnPause.innerHTML = '<span>继续转译</span>';
  btnPause.classList.add('btn-primary');
  btnPause.classList.remove('btn-warning');
}

function resumeSession() {
  isPaused = false;
  if (recognition) {
    try { recognition.start(); } catch(e){}
  }
  statusDot.className = 'status-dot recording';
  statusText.innerText = '正在听讲';
  btnPause.innerHTML = '<span>暂停</span>';
  btnPause.classList.remove('btn-primary');
  btnPause.classList.add('btn-warning');
}

function stopAndExportSession() {
  isRecording = false;
  isPaused = false;
  clearInterval(timerInterval);
  releaseWakeLock();

  if (recognition) {
    try { recognition.stop(); } catch(e){}
  }

  statusDot.className = 'status-dot';
  statusText.innerText = '已归档';

  btnMainAction.style.display = 'flex';
  btnPause.style.display = 'none';
  btnStop.style.display = 'none';
  btnMainText.innerText = '重新开始听课';

  exportTextArchive();
}

function exportTextArchive() {
  if (fullHistory.length === 0) {
    alert("当前无录制文本记录。");
    return;
  }

  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10);
  const title = `PRTS_Lecture_Notes_${dateStr}_${now.getHours()}h${now.getMinutes()}m`;

  let docContent = `# PRTS // 课堂双语同传记录\n`;
  docContent += `录制日期: ${now.toLocaleString()}\n`;
  docContent += `总授课时长: ${sessionTimer.innerText}\n`;
  docContent += `=========================================\n\n`;

  fullHistory.forEach((item, index) => {
    docContent += `[${index + 1}] ${item.time}\n`;
    docContent += `EN: ${item.en}\n`;
    docContent += `ZH: ${item.zh}\n\n`;
  });

  const blob = new Blob([docContent], { type: 'text/plain;charset=utf-8' });
  const downloadUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = downloadUrl;
  a.download = `${title}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(downloadUrl);
}

// -------------------------------------------------------------
// 7. 配置模态窗交互
// -------------------------------------------------------------
btnOpenConfig.addEventListener('click', () => {
  apiTypeSelect.value = localStorage.getItem('PRTS_TRANS_API_TYPE') || 'openai';
  apiKeyInput.value = localStorage.getItem('PRTS_TRANS_API_KEY') || '';
  apiEndpointInput.value = localStorage.getItem('PRTS_TRANS_ENDPOINT') || 'https://api.qfgapi.com/v1';
  apiModelInput.value = localStorage.getItem('PRTS_TRANS_MODEL') || 'gemini-2.5-flash';
  configModal.style.display = 'flex';
});

btnCloseConfig.addEventListener('click', () => {
  configModal.style.display = 'none';
});

btnSaveConfig.addEventListener('click', () => {
  API_TYPE = apiTypeSelect.value;
  API_KEY = apiKeyInput.value.trim();
  API_ENDPOINT = apiEndpointInput.value.trim();

  localStorage.setItem('PRTS_TRANS_API_TYPE', API_TYPE);
  localStorage.setItem('PRTS_TRANS_API_KEY', API_KEY);
  localStorage.setItem('PRTS_TRANS_ENDPOINT', API_ENDPOINT);
  localStorage.setItem('PRTS_TRANS_MODEL', apiModelInput.value.trim() || 'gemini-2.5-flash');

  configModal.style.display = 'none';
  alert("配置已保存在本地设备中。");
});
</script>
