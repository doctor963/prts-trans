<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRTS 同传">
<title>PRTS // 课堂即时同声传译</title>
<style>
  :root {
    --bg-main: #0c0f12;
    --bg-card: #151a21;
    --border-color: #242c38;
    --accent-blue: #0098dc;
    --accent-glow: rgba(0, 152, 220, 0.25);
    --text-primary: #f0f4f8;
    --text-secondary: #9ba8b8;
    --text-muted: #576575;
    --en-color: #d8e2ed;
    --zh-color: #ffffff;
    --danger: #e05252;
    --warning: #f5a623;
    --success: #3dd68c;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
  }

  /* 顶部导航栏 */
  header {
    height: 50px;
    background: rgba(15, 19, 25, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
    z-index: 10;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-logo {
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent-blue);
    transform: rotate(45deg);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .brand-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-primary);
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .status-dot.recording {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 1.5s infinite;
  }

  .status-dot.paused {
    background: var(--warning);
    box-shadow: 0 0 8px var(--warning);
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.7; }
  }

  /* 核心分屏展示区：上英文，下中文，无限延伸的长卷 */
  #stream-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-dark);
  }

  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
  }

  .pane-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    user-select: none;
  }

  .pane-top {
    border-bottom: 2px solid rgba(0, 152, 220, 0.3);
  }

  .pane-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 16px;
    font-size: 16px;
    line-height: 1.6;
    word-break: break-word;
    scroll-behavior: smooth;
  }

  #enContent {
    color: var(--en-color);
  }

  #enContent .interim-text {
    color: #ffffff;
    opacity: 0.9;
    font-style: italic;
  }

  #zhContent {
    color: var(--zh-color);
    font-weight: 500;
  }

  #zhContent .pending-indicator {
    display: inline-block;
    color: var(--accent-blue);
    opacity: 0.7;
    margin-left: 4px;
    font-size: 13px;
    animation: blink 1.2s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* 底部控制台 */
  footer {
    background: rgba(15, 19, 25, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-color);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    z-index: 10;
  }

  .control-grid {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .btn {
    flex: 1;
    min-width: 0;
    height: 44px;
    padding: 0 4px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--accent-blue);
    color: #ffffff;
    box-shadow: 0 2px 10px var(--accent-glow);
  }

  .btn-warning {
    background: #232a35;
    border: 1px solid #3c495c;
    color: var(--warning);
  }

  .btn-danger {
    background: rgba(224, 82, 82, 0.12);
    border: 1px solid rgba(224, 82, 82, 0.4);
    color: var(--danger);
  }

  .btn-secondary {
    background: #1e2430;
    border: 1px solid #323b4b;
    color: var(--text-secondary);
  }

  .config-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .config-link {
    color: var(--accent-blue);
    text-decoration: underline;
    cursor: pointer;
  }

  /* 配置模态窗 */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }

  .modal-card {
    background: #181e26;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    width: 100%;
    max-width: 360px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .input-field {
    width: 100%;
    height: 40px;
    background: #0d1116;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0 10px;
    color: var(--text-primary);
    font-size: 13px;
  }

  .input-field:focus {
    outline: none;
    border-color: var(--accent-blue);
  }
</style>
</head>
<body>

<audio id="keepAliveAudio" loop playsinline style="display:none;"></audio>

<header>
  <div class="brand-group">
    <div class="brand-logo"></div>
    <div class="brand-title">PRTS // TRANSLATOR</div>
  </div>
  <div class="status-indicator">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">就绪待命</span>
  </div>
</header>

<main id="stream-container">
  <div class="pane pane-top">
    <div class="pane-header">
      <span>ENGLISH TRANSCRIPT // 讲师英文实况</span>
      <span style="font-size:10px; opacity:0.6;">实时转录</span>
    </div>
    <div class="pane-body" id="enPane">
      <span id="enConfirmed"></span><span id="enInterim" class="interim-text"></span>
    </div>
  </div>

  <div class="pane pane-bottom">
    <div class="pane-header">
      <span>CHINESE TRANSLATION // 实时同传译文</span>
      <span id="zhStatus" style="font-size:10px; color:var(--accent-blue);">准备就绪</span>
    </div>
    <div class="pane-body" id="zhPane">
      <span id="zhConfirmed"></span><span id="zhPending" class="pending-indicator"></span>
    </div>
  </div>
</main>

<footer>
  <div class="control-grid">
    <button class="btn btn-primary" id="btnMainAction">
      <span id="btnMainText">开始听课</span>
    </button>
    <button class="btn btn-warning" id="btnPause" style="display:none;">
      <span>暂停</span>
    </button>
    <button class="btn btn-secondary" id="btnStopNoDownload" style="display:none;">
      <span>仅结束</span>
    </button>
    <button class="btn btn-danger" id="btnStop" style="display:none;">
      <span>结束并保存</span>
    </button>
  </div>
  <div class="config-bar">
    <span id="sessionTimer">历时: 00:00:00</span>
    <span class="config-link" id="btnOpenConfig">配置模型 API</span>
  </div>
</footer>

<!-- 配置窗口 -->
<div class="modal-overlay" id="configModal">
  <div class="modal-card">
    <div class="modal-title">同传引擎设置</div>
    <div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">API 格式与通道</div>
      <select id="apiTypeSelect" class="input-field">
        <option value="gemini">Google Gemini 官方通道</option>
        <option value="openai">OpenAI / 中转兼容通道</option>
      </select>
    </div>
    <div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">API Key (密钥)</div>
      <input type="password" id="apiKeyInput" class="input-field" placeholder="粘贴您的 API Key">
    </div>
    <div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">自定义端点 / 代理地址 (可选)</div>
      <input type="text" id="apiEndpointInput" class="input-field" placeholder="例如 https://api.qfgapi.com/v1">
    </div>
    <div>
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">模型名称 (OpenAI/中转通道生效)</div>
      <input type="text" id="apiModelInput" class="input-field" placeholder="默认 gemini-2.5-flash">
    </div>
    <div style="display:flex; gap:8px; margin-top:6px;">
      <button class="btn btn-primary" id="btnSaveConfig" style="height:38px;">保存</button>
      <button class="btn btn-warning" id="btnCloseConfig" style="height:38px;">取消</button>
    </div>
  </div>
</div>

<script>
// -------------------------------------------------------------
// 1. 系统核心状态管理
// -------------------------------------------------------------
let isRecording = false;
let isPaused = false;
let isRestarting = false;
let recognition = null;
let wakeLock = null;
let timerInterval = null;
let sessionSeconds = 0;
let fullHistory = [];
let currentCardId = null;
let translationTimer = null;
let audioCtx = null;

let API_TYPE = localStorage.getItem('PRTS_TRANS_API_TYPE') || 'openai';
let API_KEY = localStorage.getItem('PRTS_TRANS_API_KEY') || '';
let API_ENDPOINT = localStorage.getItem('PRTS_TRANS_ENDPOINT') || 'https://api.qfgapi.com/v1';

const streamContainer = document.getElementById('stream-container');
const btnMainAction = document.getElementById('btnMainAction');
const btnMainText = document.getElementById('btnMainText');
const btnPause = document.getElementById('btnPause');
const btnStopNoDownload = document.getElementById('btnStopNoDownload');
const btnStop = document.getElementById('btnStop');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const sessionTimer = document.getElementById('sessionTimer');
const configModal = document.getElementById('configModal');
const btnOpenConfig = document.getElementById('btnOpenConfig');
const btnCloseConfig = document.getElementById('btnCloseConfig');
const btnSaveConfig = document.getElementById('btnSaveConfig');
const apiTypeSelect = document.getElementById('apiTypeSelect');
const apiKeyInput = document.getElementById('apiKeyInput');
const apiEndpointInput = document.getElementById('apiEndpointInput');
const apiModelInput = document.getElementById('apiModelInput');
const keepAliveAudio = document.getElementById('keepAliveAudio');

// -------------------------------------------------------------
// 2. iOS 深度保活：物理无声循环 + Wake Lock 防熄屏
// -------------------------------------------------------------
function setupSilentAudioLoop() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    source.connect(audioCtx.destination);
    source.start(0);

    // 采用更稳妥的无声 WAV Base64 音频标签双保险
    keepAliveAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
    keepAliveAudio.play().catch(()=>{});
  } catch (e) {
    console.log("Audio loop handled:", e);
  }
}

async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {
      console.warn('Wake Lock error:', err);
    }
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(()=>{});
    wakeLock = null;
  }
}

// -------------------------------------------------------------
// 3. 高健壮性语音识别引擎 (防自动断连看门狗机制)
// -------------------------------------------------------------
function createRecognitionInstance() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("当前环境不支持语音识别，请在 iPhone Safari 中打开使用。");
    return null;
  }

  const sr = new SpeechRecognition();
  sr.continuous = true;
  sr.interimResults = true;
  sr.lang = 'en-US';

  sr.onstart = () => {
    isRestarting = false;
    statusDot.className = 'status-dot recording';
    statusText.innerText = '正在听讲';
  };

  sr.onresult = (event) => {
    if (isPaused) return;

    let totalFinal = '';
    let totalInterim = '';

    for (let i = 0; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        totalFinal += event.results[i][0].transcript + ' ';
      } else {
        totalInterim += event.results[i][0].transcript;
      }
    }

    handleSpeechStream(totalFinal, totalInterim);
  };

  sr.onerror = (event) => {
    console.warn("Speech error notice:", event.error);
    if (event.error === 'not-allowed') {
      alert("请允许 Safari 使用麦克风权限。");
      stopAndExportSession();
    }
  };

  // 关键：iOS Safari 静音 10 秒会自动触发 onend，必须无感知瞬时拉起
  sr.onend = () => {
    if (isRecording && !isPaused && !isRestarting) {
      isRestarting = true;
      setTimeout(() => {
        if (isRecording && !isPaused) {
          try {
            sr.start();
          } catch(e) {
            // 若抛出状态异常，彻底重建实例
            recognition = createRecognitionInstance();
            try { recognition.start(); } catch(err){}
          }
        }
        isRestarting = false;
      }, 300);
    }
  };

  return sr;
}

// -------------------------------------------------------------
// 4. 双语卡片流转与去重断句 (说一句、翻一句，不再滚重复气泡)
// -------------------------------------------------------------
function getCurrentTimeStr() {
  const now = new Date();
  return now.toTimeString().split(' ')[0];
}

// -------------------------------------------------------------
// 4. 分屏连续流转引擎 (彻底告别气泡断句，上下全屏双流自适应延伸)
// -------------------------------------------------------------
const enPane = document.getElementById('enPane');
const zhPane = document.getElementById('zhPane');
const enConfirmedElem = document.getElementById('enConfirmed');
const enInterimElem = document.getElementById('enInterim');
const zhConfirmedElem = document.getElementById('zhConfirmed');
const zhPendingElem = document.getElementById('zhPending');
const zhStatus = document.getElementById('zhStatus');

let accumulatedConfirmedEn = ''; // 已确认英文文本
let translatedEnLength = 0;       // 已翻译的英文长度游标
let isTranslating = false;        // 翻译请求并发锁
let translationQueue = [];        // 待翻译文本队列

function handleSpeechStream(totalFinal, totalInterim) {
  // 1. 实时更新英文上半屏
  // 如果识别引擎返回了新的定稿增量
  if (totalFinal.length > accumulatedConfirmedEn.length) {
    accumulatedConfirmedEn = totalFinal;
    enConfirmedElem.innerText = accumulatedConfirmedEn;
    enInterimElem.innerText = '';
    enPane.scrollTop = enPane.scrollHeight;

    // 检查是否有未翻译的英文增量
    checkAndTriggerTranslation();
  } else {
    // 正在说的临时词
    enInterimElem.innerText = totalInterim ? (' ' + totalInterim) : '';
    enPane.scrollTop = enPane.scrollHeight;
  }
}

// 检查并调度翻译：只要新增英文超过一定长度，或有停顿，就送入翻译管道
function checkAndTriggerTranslation() {
  const untranslated = accumulatedConfirmedEn.slice(translatedEnLength).trim();
  if (!untranslated) return;

  // 如果积累了至少 20 个字符（或两三个词），或者设置了防抖
  clearTimeout(translationTimer);
  translationTimer = setTimeout(() => {
    scheduleNextTranslationChunk();
  }, 400);
}

function scheduleNextTranslationChunk() {
  if (isTranslating) return;

  const untranslated = accumulatedConfirmedEn.slice(translatedEnLength).trim();
  if (!untranslated || untranslated.length < 3) return;

  const chunkToTranslate = untranslated;
  const chunkLength = accumulatedConfirmedEn.length - translatedEnLength;

  isTranslating = true;
  zhStatus.innerText = "正在同传...";
  zhPendingElem.innerText = " ●";

  triggerStreamTranslation(chunkToTranslate)
    .then((chineseText) => {
      if (chineseText) {
        // 中文下半屏持续追加
        const spacer = zhConfirmedElem.innerText.length > 0 ? ' ' : '';
        zhConfirmedElem.innerText += (spacer + chineseText);
        zhPane.scrollTop = zhPane.scrollHeight;

        translatedEnLength += chunkLength;
        saveToHistory(getCurrentTimeStr(), chunkToTranslate, chineseText);
      }
    })
    .catch((err) => {
      console.error("Translation stream error:", err);
    })
    .finally(() => {
      isTranslating = false;
      zhStatus.innerText = "准备就绪";
      zhPendingElem.innerText = "";

      // 如果翻译期间讲师又说了新的内容，立即紧跟继续翻
      if (accumulatedConfirmedEn.length > translatedEnLength) {
        setTimeout(scheduleNextTranslationChunk, 100);
      }
    });
}

// -------------------------------------------------------------
// 5. 学术大模型同传翻译接口
// -------------------------------------------------------------
async function triggerStreamTranslation(englishText) {
  if (!API_KEY) {
    return "【未配置 API Key】";
  }

  try {
    if (API_TYPE === 'gemini') {
      const endpoint = API_ENDPOINT.trim() 
        ? `${API_ENDPOINT.replace(/\/$/, '')}/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`
        : `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [
            { role: 'user', parts: [{ text: `You are a professional simultaneous interpreter for university lectures. Translate the following English speech increment into natural, fluent Simplified Chinese. Output ONLY the translated Chinese, without commentary, markdown, or punctuation extras.\n\nEnglish: "${englishText}"` }] }
          ]
        })
      });

      const data = await resp.json();
      if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
        return data.candidates[0].content.parts[0].text.trim();
      } else if (data.error) {
        return `[报错: ${data.error.message || 'Gemini异常'}]`;
      }
      return "";
    } else {
      // OpenAI / 第三方中转格式
      const endpoint = API_ENDPOINT.trim()
        ? `${API_ENDPOINT.replace(/\/$/, '')}${API_ENDPOINT.includes('/v1') ? '' : '/v1'}/chat/completions`
        : `https://api.openai.com/v1/chat/completions`;

      const chosenModel = (localStorage.getItem('PRTS_TRANS_MODEL') || 'gemini-2.5-flash').trim();

      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: chosenModel,
          messages: [
            { 
              role: "user", 
              content: `You are a simultaneous interpreter for university classroom lectures. Translate the following spoken English into natural, continuous Simplified Chinese. Output ONLY the plain translation without any commentary, quotes, or conversational fill.\n\nEnglish: ${englishText}` 
            }
          ],
          max_tokens: 200,
          temperature: 0.1
        })
      });

      const data = await resp.json();
      if (data.choices && data.choices[0] && data.choices[0].message) {
        return data.choices[0].message.content.trim();
      } else if (data.error) {
        return `[接口报错: ${data.error.message || 'API异常'}]`;
      }
      return "";
    }
  } catch (err) {
    console.error("Translation fail:", err);
    return `[网络异常: ${err.message || '断网'}]`;
  }
}

function saveToHistory(timeStr, en, zh) {
  fullHistory.push({ time: timeStr, en: en, zh: zh });
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// -------------------------------------------------------------
// 6. 控制台调度与计时
// -------------------------------------------------------------
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!isPaused) {
      sessionSeconds++;
      const h = String(Math.floor(sessionSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((sessionSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(sessionSeconds % 60).padStart(2, '0');
      sessionTimer.innerText = `历时: ${h}:${m}:${s}`;
    }
  }, 1000);
}

btnMainAction.addEventListener('click', () => {
  if (!isRecording) startSession();
});

btnPause.addEventListener('click', () => {
  if (isPaused) resumeSession();
  else pauseSession();
});

btnStopNoDownload.addEventListener('click', () => {
  if (confirm("确定结束本次听课吗？（不下载文档，页面将保留当前记录）")) {
    stopSession(false);
  }
});

btnStop.addEventListener('click', () => {
  if (confirm("是否结束当前课程并下载整篇双语笔记文档？")) {
    stopSession(true);
  }
});

function startSession() {
  recognition = createRecognitionInstance();
  if (!recognition) return;

  setupSilentAudioLoop();
  requestWakeLock();
  startTimer();

  try { recognition.start(); } catch(e){}

  isRecording = true;
  isPaused = false;

  btnMainAction.style.display = 'none';
  btnPause.style.display = 'flex';
  btnStopNoDownload.style.display = 'flex';
  btnStop.style.display = 'flex';
  btnPause.innerHTML = '<span>暂停</span>';
}

function pauseSession() {
  isPaused = true;
  if (recognition) {
    try { recognition.stop(); } catch(e){}
  }
  statusDot.className = 'status-dot paused';
  statusText.innerText = '已暂停挂起';
  btnPause.innerHTML = '<span>继续转译</span>';
  btnPause.classList.add('btn-primary');
  btnPause.classList.remove('btn-warning');
}

function resumeSession() {
  isPaused = false;
  if (recognition) {
    try { recognition.start(); } catch(e){}
  }
  statusDot.className = 'status-dot recording';
  statusText.innerText = '正在听讲';
  btnPause.innerHTML = '<span>暂停</span>';
  btnPause.classList.remove('btn-primary');
  btnPause.classList.add('btn-warning');
}

function stopSession(shouldExport = false) {
  isRecording = false;
  isPaused = false;
  clearInterval(timerInterval);
  releaseWakeLock();

  if (recognition) {
    try { recognition.stop(); } catch(e){}
  }

  statusDot.className = 'status-dot';
  statusText.innerText = shouldExport ? '已归档导出' : '已结束';

  btnMainAction.style.display = 'flex';
  btnPause.style.display = 'none';
  btnStopNoDownload.style.display = 'none';
  btnStop.style.display = 'none';
  btnMainText.innerText = '继续 / 重新开始';

  if (shouldExport) {
    exportTextArchive();
  }
}

function exportTextArchive() {
  if (fullHistory.length === 0) {
    alert("当前无录制文本记录。");
    return;
  }

  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10);
  const title = `PRTS_Lecture_Notes_${dateStr}_${now.getHours()}h${now.getMinutes()}m`;

  let docContent = `# PRTS // 课堂双语同传记录\n`;
  docContent += `录制日期: ${now.toLocaleString()}\n`;
  docContent += `总授课时长: ${sessionTimer.innerText}\n`;
  docContent += `=========================================\n\n`;

  fullHistory.forEach((item, index) => {
    docContent += `[${index + 1}] ${item.time}\n`;
    docContent += `EN: ${item.en}\n`;
    docContent += `ZH: ${item.zh}\n\n`;
  });

  const blob = new Blob([docContent], { type: 'text/plain;charset=utf-8' });
  const downloadUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = downloadUrl;
  a.download = `${title}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(downloadUrl);
}

btnOpenConfig.addEventListener('click', () => {
  apiTypeSelect.value = localStorage.getItem('PRTS_TRANS_API_TYPE') || 'openai';
  apiKeyInput.value = localStorage.getItem('PRTS_TRANS_API_KEY') || '';
  apiEndpointInput.value = localStorage.getItem('PRTS_TRANS_ENDPOINT') || 'https://api.qfgapi.com/v1';
  apiModelInput.value = localStorage.getItem('PRTS_TRANS_MODEL') || 'gemini-2.5-flash';
  configModal.style.display = 'flex';
});

btnCloseConfig.addEventListener('click', () => {
  configModal.style.display = 'none';
});

btnSaveConfig.addEventListener('click', () => {
  API_TYPE = apiTypeSelect.value;
  API_KEY = apiKeyInput.value.trim();
  API_ENDPOINT = apiEndpointInput.value.trim();

  localStorage.setItem('PRTS_TRANS_API_TYPE', API_TYPE);
  localStorage.setItem('PRTS_TRANS_API_KEY', API_KEY);
  localStorage.setItem('PRTS_TRANS_ENDPOINT', API_ENDPOINT);
  localStorage.setItem('PRTS_TRANS_MODEL', apiModelInput.value.trim() || 'gemini-2.5-flash');

  configModal.style.display = 'none';
  alert("配置已保存在本地设备中。");
});
